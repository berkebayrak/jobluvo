<!-- @dsCard group="Colors" viewport="700x120" subtitle="Muted red for errors, failed and rejected. Logos supply every other hue." name="The only colour" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;font-family:var(--font-sans);color:var(--fg);background:var(--surface-0);font-size:var(--text-sm);line-height:var(--leading-sm);-webkit-font-smoothing:antialiased}*{box-sizing:border-box}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.lbl{font-size:var(--text-2xs);color:var(--fg-subtle);letter-spacing:var(--tracking-wide);text-transform:uppercase;margin-bottom:6px}</style></head><body><div class="row" style="gap:8px"><div style="flex:1;min-width:70px"><div style="height:44px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--danger)"></div><div style="margin-top:6px;font-size:11px;font-weight:500">danger</div><div style="font-size:11px;color:var(--fg-subtle);font-variant-numeric:tabular-nums">#b4423f</div></div><div style="flex:1;min-width:70px"><div style="height:44px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--danger-soft)"></div><div style="margin-top:6px;font-size:11px;font-weight:500">danger-soft</div><div style="font-size:11px;color:var(--fg-subtle);font-variant-numeric:tabular-nums">#f7ecec</div></div><div style="flex:3;font-size:12px;color:var(--fg-muted);text-wrap:pretty">Red is text and border only, never a fill behind text. Never used for emphasis, warnings or counts. Company logos from Logo.dev are the only other colour on screen.</div></div></body></html>
