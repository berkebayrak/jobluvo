<!-- @dsCard group="Colors" viewport="700x200" subtitle="Surfaces step instead of casting shadows" name="Semantic roles" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;font-family:var(--font-sans);color:var(--fg);background:var(--surface-0);font-size:var(--text-sm);line-height:var(--leading-sm);-webkit-font-smoothing:antialiased}*{box-sizing:border-box}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.lbl{font-size:var(--text-2xs);color:var(--fg-subtle);letter-spacing:var(--tracking-wide);text-transform:uppercase;margin-bottom:6px}</style></head><body><div class="lbl">Surfaces</div><div class="row" style="gap:8px;margin-bottom:14px"><div style="flex:1;min-width:70px"><div style="height:44px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface-0)"></div><div style="margin-top:6px;font-size:11px;font-weight:500">surface-0</div><div style="font-size:11px;color:var(--fg-subtle);font-variant-numeric:tabular-nums"></div></div><div style="flex:1;min-width:70px"><div style="height:44px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface-1)"></div><div style="margin-top:6px;font-size:11px;font-weight:500">surface-1</div><div style="font-size:11px;color:var(--fg-subtle);font-variant-numeric:tabular-nums"></div></div><div style="flex:1;min-width:70px"><div style="height:44px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface-2)"></div><div style="margin-top:6px;font-size:11px;font-weight:500">surface-2</div><div style="font-size:11px;color:var(--fg-subtle);font-variant-numeric:tabular-nums"></div></div><div style="flex:1;min-width:70px"><div style="height:44px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface-3)"></div><div style="margin-top:6px;font-size:11px;font-weight:500">surface-3</div><div style="font-size:11px;color:var(--fg-subtle);font-variant-numeric:tabular-nums"></div></div><div style="flex:1;min-width:70px"><div style="height:44px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface-inverse)"></div><div style="margin-top:6px;font-size:11px;font-weight:500">surface-inverse</div><div style="font-size:11px;color:var(--fg-subtle);font-variant-numeric:tabular-nums"></div></div></div>
  <div class="lbl">Text and borders</div><div class="row" style="gap:8px"><div style="flex:1;min-width:70px"><div style="height:44px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--fg)"></div><div style="margin-top:6px;font-size:11px;font-weight:500">fg</div><div style="font-size:11px;color:var(--fg-subtle);font-variant-numeric:tabular-nums"></div></div><div style="flex:1;min-width:70px"><div style="height:44px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--fg-muted)"></div><div style="margin-top:6px;font-size:11px;font-weight:500">fg-muted</div><div style="font-size:11px;color:var(--fg-subtle);font-variant-numeric:tabular-nums"></div></div><div style="flex:1;min-width:70px"><div style="height:44px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--fg-subtle)"></div><div style="margin-top:6px;font-size:11px;font-weight:500">fg-subtle</div><div style="font-size:11px;color:var(--fg-subtle);font-variant-numeric:tabular-nums"></div></div><div style="flex:1;min-width:70px"><div style="height:44px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--fg-disabled)"></div><div style="margin-top:6px;font-size:11px;font-weight:500">fg-disabled</div><div style="font-size:11px;color:var(--fg-subtle);font-variant-numeric:tabular-nums"></div></div><div style="flex:1;min-width:70px"><div style="height:44px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--border)"></div><div style="margin-top:6px;font-size:11px;font-weight:500">border</div><div style="font-size:11px;color:var(--fg-subtle);font-variant-numeric:tabular-nums"></div></div><div style="flex:1;min-width:70px"><div style="height:44px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--border-strong)"></div><div style="margin-top:6px;font-size:11px;font-weight:500">border-strong</div><div style="font-size:11px;color:var(--fg-subtle);font-variant-numeric:tabular-nums"></div></div></div></body></html>
