<!-- @dsCard group="Shape" viewport="700x150" subtitle="1px hairlines and background steps do all the lifting" name="Borders, no shadows" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;font-family:var(--font-sans);color:var(--fg);background:var(--surface-0);font-size:var(--text-sm);line-height:var(--leading-sm);-webkit-font-smoothing:antialiased}*{box-sizing:border-box}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.lbl{font-size:var(--text-2xs);color:var(--fg-subtle);letter-spacing:var(--tracking-wide);text-transform:uppercase;margin-bottom:6px}</style></head><body><div class="row" style="gap:12px;align-items:stretch">
 <div style="flex:1;border:1px solid var(--border);border-radius:var(--radius-md);padding:12px"><div style="font-weight:500">border</div><div style="font-size:11px;color:var(--fg-subtle)">grey-200, resting cards and rows</div></div>
 <div style="flex:1;border:1px solid var(--border-strong);border-radius:var(--radius-md);padding:12px"><div style="font-weight:500">border-strong</div><div style="font-size:11px;color:var(--fg-subtle)">grey-300, controls and hover</div></div>
 <div style="flex:1;border:1px solid var(--border-focus);border-radius:var(--radius-md);padding:12px"><div style="font-weight:500">border-focus</div><div style="font-size:11px;color:var(--fg-subtle)">ink, focus, selected, attention</div></div>
 <div style="flex:1;border:1px solid var(--border);background:var(--surface-1);border-radius:var(--radius-md);padding:12px"><div style="font-weight:500">sunken</div><div style="font-size:11px;color:var(--fg-subtle)">surface-1 instead of an inset shadow</div></div></div></body></html>
