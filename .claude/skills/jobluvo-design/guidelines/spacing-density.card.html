<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;font-family:var(--font-sans);color:var(--fg);background:var(--surface-0);font-size:var(--text-sm);line-height:var(--leading-sm);-webkit-font-smoothing:antialiased}*{box-sizing:border-box}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.lbl{font-size:var(--text-2xs);color:var(--fg-subtle);letter-spacing:var(--tracking-wide);text-transform:uppercase;margin-bottom:6px}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
 <div><div class="lbl">Compact, 32px</div><div style="border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden"><div style="display:grid;grid-template-columns:2fr 1fr 40px;padding:6px 12px;min-height:var(--row-compact);align-items:center;border-bottom:1px solid var(--border)"><span style="font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Director, Strategy</span><span style="color:var(--fg-muted)">Datadog</span><span style="text-align:right;font-variant-numeric:tabular-nums">88%</span></div><div style="display:grid;grid-template-columns:2fr 1fr 40px;padding:6px 12px;min-height:var(--row-compact);align-items:center;border-bottom:1px solid var(--border)"><span style="font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Head of Strategy and Operations</span><span style="color:var(--fg-muted)">Spotify</span><span style="text-align:right;font-variant-numeric:tabular-nums">84%</span></div><div style="display:grid;grid-template-columns:2fr 1fr 40px;padding:6px 12px;min-height:var(--row-compact);align-items:center;border-bottom:1px solid var(--border)"><span style="font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Strategy and Operations Lead</span><span style="color:var(--fg-muted)">Stripe</span><span style="text-align:right;font-variant-numeric:tabular-nums">71%</span></div></div></div>
 <div><div class="lbl">Regular, 40px</div><div style="border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden"><div style="display:grid;grid-template-columns:2fr 1fr 40px;padding:10px 12px;min-height:var(--row-regular);align-items:center;border-bottom:1px solid var(--border)"><span style="font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Director, Strategy</span><span style="color:var(--fg-muted)">Datadog</span><span style="text-align:right;font-variant-numeric:tabular-nums">88%</span></div><div style="display:grid;grid-template-columns:2fr 1fr 40px;padding:10px 12px;min-height:var(--row-regular);align-items:center;border-bottom:1px solid var(--border)"><span style="font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Head of Strategy and Operations</span><span style="color:var(--fg-muted)">Spotify</span><span style="text-align:right;font-variant-numeric:tabular-nums">84%</span></div></div></div></div></body></html>
