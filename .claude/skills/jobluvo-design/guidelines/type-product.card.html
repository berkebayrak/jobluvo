<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;font-family:var(--font-sans);color:var(--fg);background:var(--surface-0);font-size:var(--text-sm);line-height:var(--leading-sm);-webkit-font-smoothing:antialiased}*{box-sizing:border-box}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.lbl{font-size:var(--text-2xs);color:var(--fg-subtle);letter-spacing:var(--tracking-wide);text-transform:uppercase;margin-bottom:6px}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px 24px">
  <div><div class="lbl">Page title, xl 500</div><div style="font-size:var(--text-xl);line-height:var(--leading-xl);font-weight:500;letter-spacing:var(--tracking-tight)">Good morning, Jack</div></div>
  <div><div class="lbl">Stat value, 2xl 600 tabular</div><div style="font-size:var(--text-2xl);line-height:var(--leading-2xl);font-weight:600;letter-spacing:var(--tracking-tight);font-variant-numeric:tabular-nums">42</div></div>
  <div><div class="lbl">Table header, 2xs uppercase wide, ink on grey-200</div><div style="font-size:var(--text-2xs);letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--fg);background:var(--surface-header);padding:6px 8px;border-radius:3px;display:inline-block">Role &nbsp; Company &nbsp; Status</div></div>
  <div><div class="lbl">Wordmark, sm 600 .18em</div><div style="font-weight:600;letter-spacing:var(--tracking-wordmark)">JOBLUVO</div></div></div></body></html>
