<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;padding:20px;font-family:var(--font-sans);color:var(--fg);background:var(--surface-0);font-size:var(--text-sm);line-height:var(--leading-sm);-webkit-font-smoothing:antialiased}*{box-sizing:border-box}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.lbl{font-size:var(--text-2xs);color:var(--fg-subtle);letter-spacing:var(--tracking-wide);text-transform:uppercase;margin-bottom:6px}</style></head><body><div class="lbl">Buttons: default, hover, selected, disabled</div>

 <div class="row" style="margin-bottom:6px"><span style="height:36px;padding:0 14px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;border-radius:var(--radius-sm);white-space:nowrap;background:#fff;color:var(--fg);border:1px solid var(--border-strong)">Save</span><span style="height:36px;padding:0 14px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;border-radius:var(--radius-sm);white-space:nowrap;background:var(--surface-1);color:var(--fg);border:1px solid var(--border-strong)">Save</span><span style="height:36px;padding:0 14px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;border-radius:var(--radius-sm);white-space:nowrap;background:var(--surface-1);color:var(--fg);border:1px solid var(--accent)">Save</span><span style="height:36px;padding:0 14px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;border-radius:var(--radius-sm);white-space:nowrap;background:var(--surface-1);color:var(--fg-disabled);border:1px solid var(--border)">Save</span><span style="width:12px"></span><span style="height:44px;padding:0 20px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;border-radius:var(--radius-sm);white-space:nowrap;background:#fff;color:var(--fg);border:1px solid var(--border-strong)">Save</span><span style="height:28px;padding:0 10px;font-size:12px;font-weight:500;display:inline-flex;align-items:center;border-radius:var(--radius-sm);white-space:nowrap;background:#fff;color:var(--fg);border:1px solid var(--border-strong)">Save</span></div>

  <label style="display:flex;flex-direction:column;gap:6px"><span style="font-size:12px;font-weight:500;color:var(--fg-disabled)">Disabled</span><span style="height:36px;border:1px solid var(--border);background:var(--surface-1);color:var(--fg-disabled);border-radius:var(--radius-sm);padding:0 10px;display:flex;align-items:center">Not editable</span></label></div>

  <div style="display:flex;gap:16px;align-items:center;padding-top:22px">

   <span style="width:28px;height:16px;border-radius:999px;border:1px solid var(--border);background:var(--surface-1);position:relative;display:inline-block"><span style="position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:999px;background:var(--surface-3)"></span></span><span style="font-size:12px;color:var(--fg-subtle)">disabled</span>
  </div></div></body></html>
