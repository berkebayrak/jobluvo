<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;padding:20px;font-family:var(--font-sans);color:var(--fg);background:var(--surface-0);font-size:var(--text-sm);line-height:var(--leading-sm);-webkit-font-smoothing:antialiased}*{box-sizing:border-box}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.lbl{font-size:var(--text-2xs);color:var(--fg-subtle);letter-spacing:var(--tracking-wide);text-transform:uppercase;margin-bottom:6px}</style></head><body><div style="display:flex;align-items:center;gap:12px;border:1px solid var(--accent);border-radius:var(--radius-md);padding:12px 16px;margin-bottom:16px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg><div style="flex:1"><span style="font-weight:500">Salesforce needs an answer from you.</span> <span style="color:var(--fg-muted)">The form asks about US work authorization.</span></div><span style="height:28px;padding:0 10px;font-size:12px;font-weight:500;display:inline-flex;align-items:center;border-radius:var(--radius-sm);white-space:nowrap;background:var(--accent);color:#fff;border:1px solid transparent">Answer</span><span style="height:28px;padding:0 10px;font-size:12px;font-weight:500;display:inline-flex;align-items:center;border-radius:var(--radius-sm);white-space:nowrap;background:#fff;color:var(--fg);border:1px solid var(--border-strong)">Later</span></div>
 <div style="display:grid;grid-template-columns:1fr 240px;gap:16px;align-items:start">
 <div style="background:var(--surface-1);padding:20px;border-radius:var(--radius-md)"><div style="width:100%;max-width:400px;margin:0 auto;background:#fff;border:1px solid var(--border-strong);border-radius:var(--radius-lg)"><div style="padding:14px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;font-size:16px;font-weight:500">Pause this lane?<span style="color:var(--fg-subtle)">×</span></div><div style="padding:16px 20px;color:var(--fg-muted);font-size:14px;line-height:21px">Applications already in progress will finish. No new ones start until you resume.</div><div style="padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px"><span style="height:36px;padding:0 14px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;border-radius:var(--radius-sm);white-space:nowrap;background:#fff;color:var(--fg);border:1px solid var(--border-strong)">Cancel</span><span style="height:36px;padding:0 14px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;border-radius:var(--radius-sm);white-space:nowrap;background:var(--accent);color:#fff;border:1px solid transparent">Pause lane</span></div></div></div>
 <div style="display:flex;flex-direction:column;gap:12px"><div class="lbl">Toast</div><div style="background:var(--surface-inverse);color:#fff;border-radius:var(--radius-md);padding:10px 12px 10px 14px;display:flex;gap:12px;align-items:center;font-size:13px"><span>Lane paused.</span><span style="color:var(--jl-grey-400);font-size:12px">Undo</span></div><div style="background:var(--surface-inverse);color:#fff;border-radius:var(--radius-md);padding:10px 14px;font-size:13px">Applying to Datadog. Submitting now.</div></div></div></body></html>
